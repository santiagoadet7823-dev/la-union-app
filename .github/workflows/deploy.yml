name: Deploy PWA to Cloudflare Pages

# La PWA vive en https://app.dist-at.com (proyecto `dist-at` de Cloudflare Pages, cuenta cardixteam;
# plan 10, 11/10/2026). Hasta 1.44.2 se publicaba en GitHub Pages: ese sitio ya NO se toca desde acá
# y queda congelado en el último deploy hasta que corra `mudanza-github-pages.yml`.
#
# Secretos del repo: CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages: Editar") y CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    # La landing (dist-at.com) tiene su propio workflow: un cambio solo ahí no recompila la PWA.
    paths-ignore:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ⚠️ Desde la reestructuración a monorepo (17/08/2026) el cliente React vive en `web/`.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # `npx` y no `cloudflare/wrangler-action`: la action instala wrangler en el package.json del
      # directorio de trabajo, y ni la raíz ni web/ lo declaran (ver package.json de la raíz).
      - name: Subir a Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=dist-at --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
