name: Deploy landing to Cloudflare Pages

# Landing comercial de DisT-At en https://dist-at.com (proyecto `dist-at-web` de Cloudflare Pages,
# cuenta cardixteam; plan 11, 11/10/2026). Es HTML/CSS estático: se sube la carpeta `landing/` tal
# cual, sin build. La PWA (app.dist-at.com) se publica aparte con `deploy.yml`.
#
# Mismos secretos que la PWA: CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages: Editar") y
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Freno: el WhatsApp y el mail de contacto se completan a mano en index.html. Si quedó algún
      # marcador sin reemplazar, no se publica una landing con botones rotos.
      - name: Revisar datos de contacto
        run: |
          if grep -rn '__WHATSAPP__\|__MAIL__' landing/; then
            echo "::error::Faltan el WhatsApp o el mail de contacto en landing/ (ver arriba)."
            exit 1
          fi
      - name: Subir a Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy landing --project-name=dist-at-web --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
