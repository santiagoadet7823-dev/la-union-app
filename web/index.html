<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" />
    <title>DisT-At</title>

    <!--
      iOS / iPadOS instalado en la pantalla de inicio (08/08/2026). El dueño de la distribuidora
      usa iPhone y entra por la PWA, no por el APK — este es su único canal.

      `apple-mobile-web-app-capable` es el que saca la barra de Safari. Safari moderno respeta el
      `display: standalone` del manifest, pero el parque de iPhones es mixto y este meta es la
      única forma de cubrir los que no. `black-translucent` deja el contenido pasar POR DEBAJO de
      la barra de estado, que es justo lo que el layout ya espera: `viewport-fit=cover` (arriba)
      más los `env(safe-area-inset-*)` de PanelDireccion. Sin las tres piezas juntas, el header se
      mete abajo de la hora y la señal.
      ⚠️ PENDIENTE (01/10/2026, riesgo R3 del brief estético v2): con Claro por defecto,
      `black-translucent` puede dejar la hora y la señal en blanco sobre la crema. Se deja como está
      hasta probarlo en el iPhone del dueño; las salidas posibles están en el brief §5.4.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DisT-At" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Bootstrap de tema ANTES del primer pintado (01/10/2026, brief estético v2 §5.3). ES5 puro, como
      el gate de abajo: corre en el WebView Chrome 79 de la tablet antes de que exista el bundle.

      Tres modos guardados en `launion-theme`: light | dark | auto. Sin nada guardado → Claro
      (decisión 1 del dueño; antes arrancaba en oscuro y React lo corregía después: flash oscuro→claro).
      `auto` se resuelve con `prefers-color-scheme`; `data-theme` lleva SIEMPRE el tema resuelto
      (light/dark), y `data-theme-mode` la preferencia.

      Reset único (decisión 2): si hay un tema guardado y falta la marca `launion-theme-v2`, se pasa
      a Claro y se escribe la marca. Va acá y no solo en React para no pintar un cuadro con el tema
      viejo. `ThemeContext.jsx` repite la misma regla (idempotente): si se cambia la clave, la marca
      o el default, se cambia en los dos lugares.

      Los dos hex son el `--bg-app` de cada tema (`index.css`) y los mismos de `COLOR_TEMA` en
      `services/nativeUI.js` (criterio A8): si cambian, cambian los tres lugares. El `<meta>` estático
      de arriba es el del tema por defecto.
    -->
    <script>
      (function () {
        var d = document.documentElement, modo = 'light', g = null, oscuro = false, tema, m;
        try {
          g = window.localStorage.getItem('launion-theme');
          if (window.localStorage.getItem('launion-theme-v2') === null) {
            // `g = null` ANTES de escribir: con el almacenamiento lleno `setItem` lanza, y si esto
            // fuera después quedaba el `dark` viejo acá mientras `ThemeContext` cae a Claro: flash
            // oscuro→claro en cada arranque (la marca nunca llega a escribirse).
            g = null;
            if (window.localStorage.getItem('launion-theme') !== null) window.localStorage.setItem('launion-theme', 'light');
            window.localStorage.setItem('launion-theme-v2', '1');
          }
        } catch (e) {}
        if (g === 'light' || g === 'dark' || g === 'auto') modo = g;
        try { oscuro = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) {}
        tema = modo === 'auto' ? (oscuro ? 'dark' : 'light') : modo;
        d.setAttribute('data-theme', tema);
        d.setAttribute('data-theme-mode', modo);
        m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', tema === 'dark' ? '#0E0E10' : '#F6F4EE');
      })();
    </script>

    <!--
      GATE DE COMPATIBILIDAD (ES5 puro, sin `?.` ni arrow functions a propósito).
      Corre ANTES del módulo, así funciona aunque el bundle no llegue a parsear.

      Por qué: la app vive dentro del WebView del sistema, que en equipos viejos queda
      congelado (Chrome 79, o menos). Antes, si el WebView era demasiado viejo para el
      bundle, la app quedaba en el SPLASH NEGRO ETERNO (el ErrorBoundary de React no ve
      un SyntaxError de parseo: ocurre antes de que React arranque). Este gate:
        1. detecta lo mínimo indispensable y avisa "actualizá el WebView";
        2. atrapa errores globales de arranque (incl. parseo del módulo);
        3. un watchdog: si a los 8 s #root sigue vacío, muestra el aviso igual.
      Así, por DEBAJO del piso se ve un mensaje claro en vez de una pantalla rota.
    -->
    <script>
      (function () {
        var mostrado = false;
        function mostrarFallback() {
          if (mostrado) return;
          // Si la app ya montó, no molestar.
          var root = document.getElementById('root');
          if (root && root.children && root.children.length > 0) return;
          mostrado = true;
          // Ocultar el splash nativo (Capacitor) para que no tape el aviso.
          try {
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
              window.Capacitor.Plugins.SplashScreen.hide();
            }
          } catch (e) {}
          var wrap = document.createElement('div');
          wrap.setAttribute('style', 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;background:#0E0E10;color:#F2F2F5;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;');
          wrap.innerHTML = '<div style="max-width:340px;line-height:1.5">'
            + '<div style="font-size:40px;margin-bottom:14px">🔄</div>'
            + '<div style="font-size:17px;font-weight:700;margin-bottom:10px">Tu navegador está desactualizado</div>'
            + '<div style="font-size:13.5px;color:#9A9AA6">Para usar la app, actualizá <b>Android System WebView</b> y <b>Google Chrome</b> desde Google Play (o el navegador en tu PC) y volvé a abrir.</div>'
            + '</div>';
          document.body.appendChild(wrap);
        }
        window.__mostrarFallbackCompat = mostrarFallback;

        // 1) Chequeo mínimo inmediato: sin estas bases, ni los polyfills arrancan.
        if (!window.Promise || !window.fetch || !window.Map || !Object.assign) {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mostrarFallback);
          } else { mostrarFallback(); }
          return;
        }

        // 2) Errores globales de arranque (incluye SyntaxError de parseo del módulo, que el
        //    ErrorBoundary de React NO puede ver). Solo actúa si la app todavía no montó.
        window.addEventListener('error', function (ev) {
          var root = document.getElementById('root');
          if (!root || !root.children || root.children.length === 0) {
            // dar un respiro por si es un error no fatal en pleno arranque
            setTimeout(mostrarFallback, 1500);
          }
          // no relanzar: log queda en consola igualmente
          if (ev && ev.message) { try { console.error('[boot]', ev.message); } catch (e) {} }
        });
        window.addEventListener('unhandledrejection', function () {});

        // 3) Watchdog: si a los 8 s #root sigue vacío, la app no arrancó → mostrar aviso.
        setTimeout(mostrarFallback, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
