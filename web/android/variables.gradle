ext {
    minSdkVersion = 23
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    // Activity Recognition (MovimientoPlugin) sale de play-services-location. Hoy la
    // versión la fijaba un default DENTRO de node_modules; fijarla acá la vuelve nuestra
    // (rootProject.ext gana sobre ese default) en vez de depender de lo que arrastre un
    // plugin de terceros.
    playServicesLocationVersion = '21.0.1'
    // firebase-messaging: lo arrastra @capacitor/push-notifications como `implementation`, que NO
    // propaga al classpath de COMPILACIÓN de :app. Nuestro LaUnionMessagingService extiende
    // MessagingService (FirebaseMessagingService) y usa RemoteMessage, así que :app necesita la
    // dependencia explícita (mismo caso que playServicesLocation). Fijamos la MISMA versión que el
    // plugin (su default es 23.3.1) para no divergir; el plugin lee este ext si está presente.
    firebaseMessagingVersion = '23.3.1'
}